<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wat eten we?</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "Fraunces"; src: url("static/fonts/fraunces.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Figtree"; src: url("static/fonts/figtree.woff2") format("woff2"); font-weight: 300 900; font-display: swap; }

/* Porcelain, cobalt and mustard: a kitchen of white tiles and blue earthenware. */
:root {
  --porcelain: #F2F5F8; --glaze: #FFFFFF; --ink: #132B45; --cobalt: #2A5B8C; --muted: #58708A;
  --line: #D3DDE6; --mustard: #E0A200; --rim: #FFFFFF; --rim-edge: #D3DDE6; --rim-shadow: rgba(19, 43, 69, 0.38);
  --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  --sans: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --porcelain: #0D1F33; --glaze: #162D47; --ink: #EEF3F8; --cobalt: #93BCE4; --muted: #9DB2C7;
    --line: #26425F; --mustard: #F2BE3A; --rim: #E9EEF3; --rim-edge: #B9C6D3; --rim-shadow: rgba(0, 0, 0, 0.55);
  }
}
:root[data-theme="dark"] {
  --porcelain: #0D1F33; --glaze: #162D47; --ink: #EEF3F8; --cobalt: #93BCE4; --muted: #9DB2C7;
  --line: #26425F; --mustard: #F2BE3A; --rim: #E9EEF3; --rim-edge: #B9C6D3; --rim-shadow: rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--porcelain); color: var(--ink); font: 400 18px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.page { min-height: 100%; max-width: 1280px; margin: 0 auto; display: grid; grid-template-rows: 1fr auto; gap: clamp(18px, 3.2vh, 34px);
        padding: clamp(18px, 3.4vw, 44px); padding-bottom: max(clamp(18px, 3vw, 36px), env(safe-area-inset-bottom)); }

/* Tonight: one plate, one name. */
.tonight { display: grid; grid-template-columns: minmax(200px, 40%) 1fr; align-items: center; gap: clamp(22px, 5vw, 72px); }
.plate { position: relative; width: 100%; max-width: min(46vh, 480px); aspect-ratio: 1; justify-self: center; border-radius: 50%;
         background: var(--rim); box-shadow: 0 0 0 clamp(8px, 1.3vw, 16px) var(--rim), 0 0 0 calc(clamp(8px, 1.3vw, 16px) + 1px) var(--rim-edge),
                     0 clamp(18px, 3vw, 38px) clamp(30px, 5vw, 60px) -22px var(--rim-shadow); }
.plate img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.plate .empty { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%;
                box-shadow: inset 0 0 0 1px var(--rim-edge), inset 0 0 0 clamp(14px, 2.6vw, 34px) var(--rim), inset 0 0 0 calc(clamp(14px, 2.6vw, 34px) + 1px) var(--rim-edge);
                font: 560 clamp(3rem, 9vw, 7rem)/1 var(--serif); color: #2A5B8C; font-variation-settings: "SOFT" 100; }
.when { margin: 0 0 clamp(6px, 1.2vh, 14px); font-weight: 650; font-size: clamp(1rem, 1.7vw, 1.3rem); color: var(--cobalt); }
.when::first-letter { text-transform: uppercase; }
.when .mark { display: inline-block; margin-left: 0.6em; padding: 0.1em 0.7em; border-radius: 999px; background: var(--mustard); color: #132B45; font-size: 0.82em; vertical-align: 0.08em; }
h1 { margin: 0; font: 560 clamp(2.1rem, 5.4vw, 4.6rem)/1.03 var(--serif); letter-spacing: -0.012em; font-variation-settings: "SOFT" 100; text-wrap: balance; }
.facts { margin: clamp(10px, 1.8vh, 20px) 0 0; color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.25rem); }
.facts b { color: var(--ink); font-weight: 650; }
.about { margin: clamp(8px, 1.4vh, 16px) 0 0; max-width: 46ch; font-size: clamp(1rem, 1.55vw, 1.2rem); }
.links { margin-top: clamp(12px, 2vh, 22px); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.links a, .links button { font: 700 1rem var(--sans); color: var(--cobalt); background: none; border: 0; padding: 10px 0; min-height: 44px; cursor: pointer;
                          text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 5px; text-decoration-thickness: 2px; }
.links button.back { padding: 8px 16px; border-radius: 999px; background: var(--glaze); box-shadow: 0 0 0 1px var(--line); text-decoration: none; }

/* The days that follow: place settings on the table. */
.week { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 1.4vw, 18px); }
.week button { width: 100%; height: 100%; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: clamp(10px, 1.4vw, 18px); text-align: left;
               padding: clamp(10px, 1.3vw, 16px); border: 0; border-radius: 20px; background: var(--glaze); color: inherit; font: inherit; cursor: pointer;
               box-shadow: 0 0 0 1px var(--line); }
.week button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--mustard); }
.week .small { position: relative; width: clamp(54px, 6.6vw, 84px); aspect-ratio: 1; border-radius: 50%; background: var(--porcelain); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.week .small img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.week .small span { position: absolute; inset: 0; display: grid; place-items: center; font: 560 1.5rem var(--serif); color: var(--cobalt); }
.week .day { display: block; font-weight: 700; font-size: 0.92rem; color: var(--cobalt); }
.week .day::first-letter { text-transform: uppercase; }
.week .name { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font: 520 clamp(1.02rem, 1.5vw, 1.22rem)/1.18 var(--serif); font-variation-settings: "SOFT" 100; }
.week .line { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; margin-top: 2px; color: var(--muted); font-size: 0.88rem; }
:focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px; }

.notice { align-self: center; justify-self: center; text-align: center; max-width: 34ch; }
.notice h1 { font-size: clamp(1.8rem, 4.2vw, 3rem); }
.notice p { color: var(--muted); }

/* One arrival: the plate is set down, the name follows. */
@media (prefers-reduced-motion: no-preference) {
  .tonight.arrive .plate { animation: set-down 620ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .tonight.arrive .words { animation: follow 520ms 140ms ease-out both; }
  @keyframes set-down { from { opacity: 0; transform: translateY(-14px) scale(0.965); } to { opacity: 1; transform: none; } }
  @keyframes follow { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}

@media (max-width: 760px), (orientation: portrait) and (max-width: 900px) {
  .page { grid-template-rows: auto auto; }
  .tonight { grid-template-columns: 1fr; text-align: center; gap: 26px; }
  .plate { max-width: min(68vw, 340px); margin-top: 8px; }
  .about { margin-left: auto; margin-right: auto; }
  .links { justify-content: center; }
  .week { grid-template-columns: 1fr; }
}
@media (min-width: 761px) and (max-height: 620px) { .about { display: none; } .week .line { display: none; } }
</style>
</head>
<body>
<main class="page" id="page" aria-live="polite"></main>
<script>
"use strict";
(function () {
  var theme = new URLSearchParams(location.search).get("theme");
  if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
  var page = document.getElementById("page"), data = null, shown = null, first = true, backTimer = null;
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function longDate(iso) { return new Date(iso + "T12:00:00").toLocaleDateString("nl-BE", { weekday: "long", day: "numeric", month: "long" }); }
  function picture(d, cls) {
    var letter = esc((d.name || "?").trim().charAt(0).toUpperCase());
    var fallback = cls === "plate" ? '<div class="empty" aria-hidden="true">' + letter + "</div>" : '<span aria-hidden="true">' + letter + "</span>";
    return fallback + (d.image ? '<img src="' + esc(d.image) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : "");
  }
  function facts(d) {
    var parts = [];
    if (d.minutes) parts.push("Klaar in <b>" + (d.minutes >= 60 ? (Math.floor(d.minutes / 60) + " u" + (d.minutes % 60 ? " " + d.minutes % 60 : "")) : d.minutes + " minuten") + "</b>");
    if (d.type && d.type !== "gemengd") parts.push(esc(d.type));
    return parts.join(", ");
  }
  function render(animate) {
    if (!data) return;
    var today = data.dish, days = data.upcoming || [];
    var hero = (shown && [today].concat(days).filter(Boolean).find(function (d) { return d.date === shown; })) || today;
    var html = "";
    if (hero) {
      var isToday = hero.date === data.today;
      html += '<section class="tonight' + (animate ? " arrive" : "") + '">' +
        '<div class="plate">' + picture(hero, "plate") + "</div>" +
        '<div class="words"><p class="when">' + esc(longDate(hero.date)) + (isToday ? '<span class="mark">vandaag</span>' : "") + "</p>" +
        "<h1>" + esc(hero.name) + "</h1>" +
        (facts(hero) ? '<p class="facts">' + facts(hero) + "</p>" : "") +
        (hero.brief ? '<p class="about">' + esc(hero.brief) + "</p>" : "") +
        '<div class="links">' + (!isToday ? '<button class="back" id="back">Terug naar vandaag</button>' : "") +
        '<a href="' + esc(hero.url) + '" target="_blank" rel="noopener">Bekijk het recept</a>' +
        (data.manage ? '<a href="./">Menu beheren</a>' : "") + "</div></div></section>";
    } else {
      html += '<section class="notice"><p class="when">' + esc(longDate(data.today)) + "</p><h1>" +
        (days.length ? "Vandaag staat er niets op het menu" : "Er is nog geen weekmenu") + "</h1>" +
        "<p>" + (days.length ? "Hieronder zie je wat er de volgende dagen komt." : "Maak een voorstel in Weekmenu en het verschijnt hier.") + "</p>" +
        (data.manage ? '<div class="links" style="justify-content:center"><a href="./">Menu beheren</a></div>' : "") + "</section>";
    }
    var rest = days.filter(function (d) { return !hero || d.date !== hero.date; });
    if (hero && today && hero.date !== today.date) rest.unshift(today);
    if (rest.length) {
      html += '<ul class="week">' + rest.slice(0, 6).map(function (d) {
        var label = d.date === data.today ? "vandaag" : new Date(d.date + "T12:00:00").toLocaleDateString("nl-BE", { weekday: "long" });
        return '<li><button data-date="' + d.date + '" aria-pressed="false" aria-label="' + esc(label + ": " + d.name) + '">' +
          '<span class="small">' + picture(d, "small") + "</span><span><span class=\"day\">" + esc(label) + "</span>" +
          '<span class="name">' + esc(d.name) + "</span>" + (d.minutes ? '<span class="line">' + d.minutes + " minuten</span>" : "") + "</span></button></li>";
      }).join("") + "</ul>";
    } else if (hero) {
      html += "<div></div>";
    }
    page.innerHTML = html;
  }
  function load() {
    fetch("api/display", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      var changed = JSON.stringify(d) !== JSON.stringify(data);
      data = d;
      if (shown && shown < d.today) shown = null;
      if (changed) { render(first); first = false; }
    }).catch(function () {
      if (!data) page.innerHTML = '<section class="notice"><h1>Even geen verbinding</h1><p>Het weekmenu verschijnt zodra Home Assistant weer bereikbaar is.</p></section>';
    });
  }
  page.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    clearTimeout(backTimer);
    if (b.id === "back") { shown = null; return render(true); }
    if (b.dataset.date) {
      shown = b.dataset.date === data.today ? null : b.dataset.date;
      render(true);
      if (shown) backTimer = setTimeout(function () { shown = null; render(true); }, 60000);   // a wall display returns to today by itself
    }
  });
  load();
  setInterval(load, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
